name: astrbot_plugin_ba_fortune
display_name: BA 运势
short_desc: 碧蓝档案主题每日运势，122 位学生随机出镜
desc: |-
  碧蓝档案（Blue Archive）主题的每日运势插件。

  发送 `/ba运势`，随机抽取 1~5 星运势（大吉 / 中吉 / 小吉 / 吉 / 凶），
  并由 Playwright 动态渲染一张专属运势卡片：幸运学生（122 位，全部带头像与台词）、
  幸运社团 / 地点 / 道具 / 数字 / 幸运色 / 幸运时段、四项运气条、宜忌与基沃托斯风格解读。

  发送 `/ba运势榜` 可查看本群今日运势榜（图片，前 15 名，显示玩家头像与奖牌）。

  特性：
  - 每人每天 1 次，北京时间零点自动清零
  - 学生名单与头像来自 SchaleDB，已打包本地化，离线可用
  - 用户头像自动获取（官方 bot 走 qqapp 接口，OneBot 走 qlogo）
  - 渲染失败自动回退为文字，不会报错
version: 1.3.1
author: chen
repo: "https://github.com/Arona688/astrbot_plugin_ba_fortune"
astrbot_version: ">=4.20.0"
support_platforms:
  - qq_official
  - qq_official_webhook
  - aiocqhttp
tags:
  - 碧蓝档案
  - BlueArchive
  - 运势
  - 娱乐
  - 图片渲染
